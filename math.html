<script>

    function updateProgress() {

        let completedLessons = 0;

        let lesson1Completed =
            localStorage.getItem(
                "mathLesson1Completed"
            );

        let lesson2Completed =
            localStorage.getItem(
                "mathLesson2Completed"
            );


        if (lesson1Completed === "true") {

            completedLessons++;

            let button =
                document.getElementById(
                    "lesson1Button"
                );

            button.innerHTML =
                "✓ Completed";

            button.classList.add(
                "completed"
            );
        }


        if (lesson2Completed === "true") {

            completedLessons++;

            let buttons =
                document.querySelectorAll(
                    ".start-lesson"
                );

            buttons[1].innerHTML =
                "✓ Completed";

            buttons[1].classList.add(
                "completed"
            );

            buttons[1].href =
                "lesson2.html";
        }


        let totalLessons = 5;

        let progress =
            (completedLessons / totalLessons) * 100;


        document.getElementById(
            "progressBar"
        ).style.width =
            progress + "%";


        document.getElementById(
            "progressText"
        ).innerHTML =
            progress + "%";

    }


    updateProgress();

</script>
