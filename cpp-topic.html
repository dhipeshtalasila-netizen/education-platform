/* =========================================================

function generateGenericContent(topic) {

    const cleanTopic = topic.trim();

    return {

        description:
            `${cleanTopic} is an important topic in C++ programming and is part of the broader C++ learning curriculum.`,

        objective:
            `Understand the meaning, purpose, syntax and practical use of ${cleanTopic} in C++ programs.`,

        explanation:
            `${cleanTopic} is used in C++ programming to help developers build programs, solve problems and work with the language's features and Standard Library. Study the concept carefully, understand its syntax, and practice it with small programs before using it in larger projects.`,

        syntax:
`#include <iostream>

int main() {

    // ${cleanTopic}

    std::cout << "Learning ${cleanTopic}";

    return 0;
}`,

        output:
            `Learning ${cleanTopic}`,

        keyPoints: [

            `${cleanTopic} is part of the C++ programming ecosystem.`,

            "Understand the concept before memorizing syntax.",

            "Practice the topic with small programs.",

            "Pay attention to data types, scope and program behavior.",

            "Use the Standard Library when an appropriate facility already exists.",

            "Test your program with normal cases and edge cases."

        ],

        mistakes: [

            "Ignoring compiler warnings and errors.",

            "Using complicated code when a simpler solution is available.",

            "Not testing the program with different inputs."

        ]

    };

}


/* =========================================================
   FIND CONTENT
========================================================= */

function getContent(topic) {

    const normalized =
        normalizeTopic(topic);

    if (topicContent[normalized]) {

        return topicContent[normalized];

    }

    const alias =
        topicAliases[normalized];

    if (
        alias &&
        topicContent[alias]
    ) {

        return topicContent[alias];

    }

    return generateGenericContent(topic);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   COMPLETION KEY
========================================================= */

function getCompletionKey() {

    return "cppCompleted_" +
        normalizeTopic(topicName);

}


/* =========================================================
   MARK COMPLETE
========================================================= */

function markTopicComplete() {

    localStorage.setItem(
        getCompletionKey(),
        "true"
    );

    updateCompletionButton();

}


/* =========================================================
   UPDATE BUTTON
========================================================= */

function updateCompletionButton() {

    const button =
        document.getElementById(
            "completeButton"
        );

    if (!button) return;


    const completed =
        localStorage.getItem(
            getCompletionKey()
        ) === "true";


    if (completed) {

        button.textContent =
            "✓ Topic Completed";

        button.classList.add(
            "completed"
        );

    } else {

        button.textContent =
            "Mark Topic Complete";

        button.classList.remove(
            "completed"
        );

    }

}
