/* =========================================================
   FIND TOPIC
========================================================= */

function getContent(topic) {

    const normalized = normalizeTopic(topic);

    if (topicContent[normalized]) {

        return topicContent[normalized];

    }

    const alias = topicAliases[normalized];

    if (alias && topicContent[alias]) {

        return topicContent[alias];

    }

    return null;

}

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* =========================================================
   COMPLETION SYSTEM
========================================================= */

function getCompletionKey() {

    return "cppCompleted_" +
        normalizeTopic(topicName);

}


function markTopicComplete() {

    localStorage.setItem(
        getCompletionKey(),
        "true"
    );

    updateCompletionButton();

}


function updateCompletionButton() {

    const button =
        document.getElementById("completeButton");

    if (!button)
        return;


    const completed =
        localStorage.getItem(
            getCompletionKey()
        ) === "true";


    if (completed) {

        button.textContent =
            "✓ Topic Completed";

        button.classList.add("completed");

    } else {

        button.textContent =
            "Mark Topic Complete";

        button.classList.remove("completed");

    }

}


/* =========================================================
   DARK MODE
========================================================= */

function loadDarkMode() {

    if (
        localStorage.getItem("darkMode") === "true"
    ) {

        document.body.classList.add("dark");

    }

}


/* =========================================================

========================================================= */

loadDarkMode();

displayTopic();
