/* =========================================================
   GET CONTENT
========================================================= */

function getContent(topic) {

    const normalized =
        normalizeTopic(topic);

    if (topicContent[normalized]) {

        return topicContent[normalized];

    }

    const alias =
        topicAliases[normalized];

    if (
        alias &&
        topicContent[alias]
    ) {

        return topicContent[alias];

    }

    return generateGenericContent(topic);

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   COMPLETION
========================================================= */

function completionKey() {

    return "cppCompleted_" +
        normalizeTopic(topicName);

}


function markTopicComplete() {

    localStorage.setItem(
        completionKey(),
        "true"
    );

    updateCompletionButton();

}


function updateCompletionButton() {

    const button =
        document.getElementById(
            "completeButton"
        );

    if (!button) return;

    const completed =
        localStorage.getItem(
            completionKey()
        ) === "true";

    if (completed) {

        button.textContent =
            "✓ Topic Completed";

        button.classList.add(
            "completed"
        );

    } else {

        button.textContent =
            "Mark Topic Complete";

        button.classList.remove(
            "completed"
        );

    }

}
