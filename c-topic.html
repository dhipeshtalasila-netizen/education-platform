/* =========================================================

function getTopicDescription(levelName) {

    }

    if (levelName === "Core") {
        return "Develop strong C programming skills through core language features, control structures, expressions, functions and problem solving.";
    }

    if (levelName === "Advanced") {
        return "Explore advanced C concepts including memory management, pointers, structures, files, libraries and implementation details.";
    }

    if (levelName === "Professional") {
        return "Study professional C programming practices involving security, systems programming, embedded development and industry techniques.";
    }

    if (levelName === "Practical") {
        return "Apply C programming knowledge through practical programming problems and implementation exercises.";
    }

    if (levelName === "Project") {
        return "Apply your C programming knowledge by developing practical projects.";
    }

    if (levelName === "Career") {
        return "Prepare for C programming examinations, practical assessments, viva examinations and technical interviews.";
    }

    return "Learn this C programming topic through EduLearn.";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================

        document.getElementById("levelBadge").textContent =
            "Course";

        return;

    }


    const topicTitle = topic.trim();

    const normalizedTopic =
        topicTitle.toLowerCase();

    const data =
        topicData[normalizedTopic] ||
        createFallbackData(topicTitle, level);


    document.getElementById("topicNumber").textContent =
        number
            ? "Topic " + number
            : "C Programming Topic";


    document.getElementById("topicTitle").textContent =
        topicTitle;


    document.getElementById("topicDescription").textContent =
        data.description ||
        getTopicDescription(level);


    document.getElementById("moduleBadge").textContent =
        moduleName || "C Programming";


    document.getElementById("levelBadge").textContent =
        level || "C Programming";


    document.getElementById("objective").textContent =
        data.objective;


    document.getElementById("conceptText").textContent =
        data.concept;


    document.getElementById("importanceText").textContent =
        data.importance;


    document.getElementById("exampleIntroduction").textContent =
        data.example;


    document.getElementById("codeExample").textContent =
        data.code;


    /* Add syntax section dynamically */

    const conceptCard =
        document.getElementById("conceptText").closest(".content-card");


    if (!document.getElementById("syntaxText")) {

        const syntaxTitle =
            document.createElement("h3");

        syntaxTitle.textContent =
            "Syntax";

        const syntaxText =
            document.createElement("p");

        syntaxText.id =
            "syntaxText";

        conceptCard.appendChild(syntaxTitle);

        conceptCard.appendChild(syntaxText);

    }


    document.getElementById("syntaxText").textContent =
        data.syntax;


    /* Add output section */

    const exampleCard =
        document.getElementById("codeExample").closest(".content-card");


    if (!document.getElementById("outputText")) {

        const outputTitle =
            document.createElement("h3");

        outputTitle.textContent =
            "Expected Output";

        const outputText =
            document.createElement("p");

        outputText.id =
            "outputText";

        exampleCard.appendChild(outputTitle);

        exampleCard.appendChild(outputText);

    }


    document.getElementById("outputText").textContent =
        data.output;


    /* Key points */

    const keyPointList =
        document.getElementById("keyPoints");

    keyPointList.innerHTML = "";


    data.points.forEach(point => {

        const li =
            document.createElement("li");

        li.textContent =
            point;

        keyPointList.appendChild(li);

    });


    /* Practice */

    document.getElementById("practiceText").textContent =
        data.practice;


    document.title =
        "EduLearn - " + topicTitle;

}


/* =========================================================
   TOPIC COMPLETION
========================================================= */

function getTopicKey() {

    if (!topic) {
        return null;
    }

    return "c_topic_completed_" + topic.trim();

}


function checkCompletion() {

    const key =
        getTopicKey();

    if (!key) {
        return;
    }

    const completed =
        localStorage.getItem(key) === "true";

    const status =
        document.getElementById("completionStatus");

    const button =
        document.getElementById("completeButton");


    if (completed) {

        status.textContent =
            "✓ This topic has been completed. Continue practicing or move to another C topic.";

        button.textContent =
            "✓ Topic Completed";

    } else {

        status.textContent =
            "This topic has not been completed yet.";

        button.textContent =
            "✓ Mark Topic as Completed";

    }

}


/* =========================================================
   MARK TOPIC COMPLETE
========================================================= */

    const key =
        getTopicKey();

    if (!key) {
        return;
    }

    localStorage.setItem(
        key,
        "true"
    );

    checkCompletion();

}
