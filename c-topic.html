}

.content-box p {

}

.content-box ul {
    margin-left: 25px;
    color: #555;
    line-height: 1.9;
}

.code-box {

    color: #e5e7eb;

    border-radius: 10px;

    margin-top: 15px;
    margin-bottom: 15px;
}

    white-space: pre-wrap;
    line-height: 1.6;
    font-family: Consolas, monospace;

/* ================= NAVIGATION ================= */

.topic-navigation {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 30px;

.nav-btn {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.nav-btn:hover {
    background: #1d4ed8;
}

.nav-btn.disabled {
    background: #9ca3af;
    pointer-events: none;
}

/* ================= ERROR ================= */

.error-box {
    background: white;
    padding: 40px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);

.error-box h2 {

.error-box p {

let allTopics = [];
let number = 1;

modules.forEach(module => {

    module.topics.forEach(topic => {

        allTopics.push({
            number: number,
            name: topic,
            module: module.title,
            level: module.level
        });

        number++;

    });

});


/* =========================================================
   SLUG
========================================================= */

function createSlug(text) {

    return text
        .toLowerCase()
        .replace(/<[^>]*>/g, "")
        .replace(/[()]/g, "")
        .replace(/#/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

}


/* =========================================================
   GET URL TOPIC
========================================================= */

const requestedTopic =
    params.get("topic");


/* =========================================================
   FIND TOPIC
========================================================= */

const topic =
    allTopics.find(item =>
        createSlug(item.name) === requestedTopic
    );

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
