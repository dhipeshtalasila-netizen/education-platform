<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduLearn - Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        /* NAVBAR */

        .navbar {
            background: #1e3a8a;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }


        /* MAIN */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }


        /* PAGE HEADER */

        .page-header {
            background: white;
            padding: 30px;

            border-radius: 12px;

            margin-bottom: 25px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .page-header h1 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #666;
        }


        /* PROFILE */

        .profile-card {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);

            margin-bottom: 25px;
        }


        .profile-top {
            display: flex;
            align-items: center;
            gap: 25px;

            margin-bottom: 30px;
        }


        .profile-picture {

            width: 100px;
            height: 100px;

            border-radius: 50%;

            background: #e8eefc;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;
        }


        .profile-name h2 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .profile-name p {
            color: #666;
        }


        /* INFORMATION */

        .information {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .info-box {

            background: #f4f6f9;

            padding: 18px;

            border-radius: 8px;
        }


        .info-box label {

            display: block;

            color: #777;

            font-size: 13px;

            margin-bottom: 6px;
        }


        .info-box strong {

            color: #222;

            font-size: 16px;
        }


        /* ACTIVITY */

        .activity {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }


        .activity h2 {

            color: #1e3a8a;

            margin-bottom: 20px;
        }


        .activity-item {

            padding: 15px 0;

            border-bottom: 1px solid #eee;

            display: flex;

            justify-content: space-between;

            color: #555;
        }


        .activity-item:last-child {

            border-bottom: none;

        }


        /* RESPONSIVE */

        @media (max-width: 700px) {

            .navbar {

                padding: 15px 20px;

            }

            .nav-links {

                gap: 12px;

            }

            .information {

                grid-template-columns: 1fr;

            }

            .profile-top {

                flex-direction: column;

                align-items: flex-start;

            }

        }


        @media (max-width: 500px) {

            .nav-links {

                display: none;

            }

            .container {

                width: 94%;

            }

        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <nav class="navbar">

        <div class="logo">
            EduLearn
        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="courses.html">
                Courses
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

    </nav>



    <!-- MAIN -->

    <main class="container">


        <!-- HEADER -->

        <section class="page-header">

            <h1>
                Student Profile
            </h1>

            <p>
                View your academic information and learning activity.
            </p>

        </section>



        <!-- PROFILE CARD -->

        <section class="profile-card">


            <div class="profile-top">


                <div class="profile-picture">
                    👤
                </div>


                <div class="profile-name">

                    <h2>
                        Student
                    </h2>

                    <p>
                        Undergraduate Student
                    </p>

                </div>


            </div>



            <!-- INFORMATION -->

            <div class="information">


                <div class="info-box">

                    <label>
                        Full Name
                    </label>

                    <strong>
                        Student
                    </strong>

                </div>


                <div class="info-box">

                    <label>
                        Academic Level
                    </label>

                    <strong>
                        Undergraduate
                    </strong>

                </div>


                <div class="info-box">

                    <label>
                        Program
                    </label>

                    <strong>
                        College Student
                    </strong>

                </div>


                <div class="info-box">

                    <label>
                        Learning Platform
                    </label>

                    <strong>
                        EduLearn
                    </strong>

                </div>


            </div>

        </section>



        <!-- ACTIVITY -->

        <section class="activity">

            <h2>
                Learning Activity
            </h2>


            <div class="activity-item">

                <span>
                    Mathematics Course
                </span>

                <span>
                    In Progress
                </span>

            </div>


            <div class="activity-item">

                <span>
                    Lessons Completed
                </span>

                <span id="lessonsCompleted">
                    0
                </span>

            </div>


            <div class="activity-item">

                <span>
                    Course Progress
                </span>

                <span id="courseProgress">
                    0%
                </span>

            </div>


        </section>


    </main>



    <!-- JAVASCRIPT -->

    <script>

        const totalLessons = 5;

        let completedLessons = 0;


        for (
            let i = 1;
            i <= totalLessons;
            i++
        ) {

            if (
                localStorage.getItem(
                    "lesson" + i + "Completed"
                ) === "true"
            ) {

                completedLessons++;

            }

        }


        const progress = Math.round(
            (completedLessons / totalLessons) * 100
        );


        document.getElementById(
            "lessonsCompleted"
        ).textContent =
            completedLessons;


        document.getElementById(
            "courseProgress"
        ).textContent =
            progress + "%";

    </script>


</body>

</html>
